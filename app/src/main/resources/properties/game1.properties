# game1: sample properties file for development/manual play (spec
# section 1.1, the simple version). Troll only, the hardcoded
# default maze, plain pill(+1)/gold(+5)/ice(+0) scoring with no monster
# side effects. PacMan.isAuto=false, so `./gradlew run` with this file
# is playable interactively with the keyboard (Left/Right/Up/Down).
#
# feature1.active/feature2.active/feature3.active are present but not
# yet wired up to anything - they're scaffolding for the configurable
# "simple" vs "multiverse" version described in the spec (section 2.2),
# left for you to design and implement as part of the extension work.
feature1.active=false
feature2.active=false
feature3.active=false

Troll.location=18,9
PacMan.location=4,9
#Auto Test Configurations
PacMan.isAuto=false
PacMan.move=
Gold.location=
