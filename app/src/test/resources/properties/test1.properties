# Original/simple version (spec section 1.1): no new features active.
# Only Troll, the hardcoded default maze, and plain pill(+1)/gold(+5)/
# ice(+0) scoring with no monster side effects.
#
# PacMan.move is a fully scripted 37-move BFS-computed route (padded
# with a few trailing "S"s) from (10,9) to every item in column 4:
# east corridor -> down to (4,7) [gold, tick 12] -> (4,8)/(4,9)
# [pills, ticks 14/15] -> back up via the column-3 detour (column 4 is
# wall-blocked at row 6) to (4,5) [ice, tick 26] -> further up via the
# same column-3 detour (column 4 is also wall-blocked at row 4) to
# (4,3)/(4,2)/(4,1) [pills, ticks 34/36/37]. Score/Pills after tick 37:
# nbPills=6 (5 pills + 1 gold; ice doesn't count) meets
# maxPillsAndItems=6 exactly, so the run ends in "YOU WIN" right after
# tick 37 - fully deterministic, no reliance on PacActor's own
# auto-pilot fallback.
#
# Troll: the whole of column 18 north of
# it is open, so 4 scripted "M"s (Troll spawns facing NORTH regardless
# of location) are 4 clean, always-successful moves to (18,8), (18,7),
# (18,6), then (18,5) - keeping the original "Troll moves from tick 1,
# no startup idle" regression check meaningful. Troll.0.move then holds
# Troll there ("S" x57 for the rest of the run): (18,5) is nowhere on
# PacMan's 37-cell route above
# (confirmed by directly cross-checking both actors' full cell lists
# in Python), so Troll can never collide with PacMan - this is what
# makes "YOU WIN" a guaranteed outcome regardless of run, not just
# incidentally true under one fixed seed.

feature1.active=false
feature2.active=false
feature3.active=false

Troll.location=18,9
PacMan.location=10,9
Simulation.period=100
#Auto Test Configurations
PacMan.isAuto=true
PacMan.move=R,R,M,M,M,M,R,M,M,L,M,M,L,M,M,R,R,M,M,L,M,R,M,M,R,M,R,R,M,R,M,M,R,M,L,M,M,S,S,S,S,S,S,S,S,S,S
Troll.0.move=M,M,M,M,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S
