# test5: all 3 features combined (new monster types + item effects +
# configurable map) - the full multiverse integration scenario, in 3
# phases: (1) fury, demonstrated via a scripted Troll and Wizard, (2)
# freeze, demonstrated the same way plus Orion's own unscripted
# movement going silent too, (3) a long unscripted-Orion-only patrol
# window with every other actor safely contained, ending in a
# deterministic scripted kill: Troll-1 walks to PacMan's resting cell
# starting tick 71 and lands on it at tick 83.
feature1.active=true
feature2.active=true
feature3.active=true

# Feature 3: configurable map - a custom 14x10 rectangular maze (not the
# hardcoded default). PacMan's and every monster's start location are
# embedded directly in the layout (per spec: "the initial location of
# PacMan/monsters is defined within the map file"). 3 gold pieces
# ((4,2), (10,2), (11,7)) and 2 ice cubes ((2,3), (6,4)) so Feature 2
# has plenty to trigger, 2 Trolls (row-major scan order: (7,4) is
# Troll-0, (6,7) is Troll-1), 1 Orion (11,6), 1 Wizard (12,7), and real
# internal walls (row 5's (5,5)-(7,5) block, the (8,7)/(9,7) pair) for
# Wizard's wall-phase mechanic and general navigation.
#   x = wall, . = pill, (space) = empty, g = gold, i = ice,
#   P = PacMan, T = Troll, O = Orion, W = Wizard
Map.layout=xxxxxxxxxxxxxx;\
xP...........x;\
x...g.....g..x;\
x.i......xx..x;\
x.....iT.....x;\
x....xxx.....x;\
x..........Oxx;\
x.....T.xx.gWx;\
x............x;\
xxxxxxxxxxxxxx

# Orion.0.move is deliberately left UNSET  Orion here runs its own real, unscripted
# patrol logic for the entire run (same as test2.properties), so its
# movement genuinely demonstrates spec Feature 1a rather than replaying
# a canned script. Every other actor (PacMan, both Trolls, Wizard) is
# instead scripted precisely enough to structurally guarantee it can
# never collide with Orion - see the per-phase breakdown below.
#
# PHASE 1 (ticks 1-10): PacMan walks straight to the (4,2) gold and
# eats it at tick 5, triggering fury. During the resulting 5-tick fury
# window (ticks 6-10):
#  - Troll-0 (at (7,4), turned to face east at tick 1, held until the
#    trigger) is on a corridor open 5 cells to its east before hitting
#    the map's east border wall - its 5 scripted "M"s land 2, 2, 1, 0,
#    0 cells each (9,4 -> 11,4 -> 12,4 -> 12,4 -> 12,4), demonstrating
#    all 3 possible fury-jump outcomes from a single monster.
#  - Wizard (at (12,7)) opens with its OWN demo at tick 1 - a single
#    scripted "M" facing directly into the wall cell at (12,6) (still
#    Normal at that point, one tick before PacMan even reaches the
#    gold), phasing through to (12,5) - then turns to face west and
#    holds until the same fury window, where its own 5 scripted "M"s
#    land 2, 2, 0, 0, 0 cells (10,5 -> 8,5 -> 8,5 -> 8,5 -> 8,5),
#    blocked earlier than Troll-0's by the (5,5)-(7,5) wall block.
#    NOTE (a deliberate deviation from a literal read of the brief):
#
# PHASE 2: PacMan continues on to the (2,3) ice cube, eating it at
# tick 10 - the very last fury tick - which triggers freeze
# immediately afterward (ticks 11-13). Troll-0/Troll-1 go fully silent
# (freeze burns whatever their scripts say, same as test3); Wizard's
# own freeze-immunity alternation (Wizard.onFrozenTick()) still
# applies regardless of script content, so it keeps producing 1-2
# genuinely random (not scripted) moves during this window -
# asserted via assertTickLineContains (State only, not Location), same
# convention as before. Orion, though unscripted, is also a monster
# and freezeMonsters() applies to all of them - it has no freeze-
# immunity override of its own (only Wizard does), so it goes
# completely silent for these 3 ticks too, checked the same way as the
# Trolls (absence of any [Orion-0] log line for ticks 11-13).
#
# PHASE 3 (ticks 14 on): PacMan finishes retreating back up column 1 to
# (1,1) - its own start cell, the map's corner, as far from Orion's
# gold-patrol loop (columns 4-11) as this map allows - by tick 15 and
# then holds (S) there; Troll-0 retreats from its fury-end position
# (12,4) back across row 4 and down to (2,8) by tick 30, then holds;
# Wizard, once its own random freeze-drift settles, simply holds (S)
# wherever that left it.
#
# Troll-1 stays parked at its own spawn (6,7) - a cell nowhere near
# PacMan's own route - through tick 70, holding well clear of every
# other actor's phase 1/2/3 demonstration above. Starting tick 71, it's
# scripted to walk to PacMan's resting cell and end the test with a
# real, deterministic kill: "M" (6,7 -> 6,6, still facing its NORTH
# spawn direction), "L,M,M,M,M,M" turns west and crosses row 6 (open
# the whole way, since row 6's only obstruction is the border wall at
# its far east end, well behind Troll-1's approach) to (1,6), then
# "R,M,M,M,M,M" turns north and climbs column 1 (open rows 1-6, the
# same corridor PacMan itself retreated up in phase 3) to land on
# PacMan's own (1,1) at tick 83, ending the game as "GAME OVER" -
# verified via the same BFS-route-then-real-run discipline used
# throughout this session.
Troll.0.move=R,S,S,S,S,M,M,M,M,M,S,S,S,R,R,M,M,M,M,M,M,M,M,M,M,L,M,M,M,M,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S
Troll.1.move=S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,M,L,M,M,M,M,M,R,M,M,M,M,M,S,S,S,S,S,S,S
Wizard.0.move=M,L,S,S,S,M,M,M,M,M,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S
