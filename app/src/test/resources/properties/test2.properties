# test2: Feature 1 (new monster types: Orion + Wizard), isolated from
# Feature 2 (item effects) and Feature 3 (configurable map) so gold/ice
# pickups stay plain and the default hardcoded maze is used.
#
# 3 gold pieces (overriding the default maze's single gold via
# Gold.location) so Orion's fixed patrol sequence is actually
# observable: (18,1) -> (18,7) -> (13,7) -> back to (18,1) -> ...
# PacMan's scripted move eats the 3rd gold piece (13,7) early, then
# turns around and retreats west to (7,7) and holds there - out of
# Orion's entire patrol loop stays within columns 13-18 the whole run, so Orion's later visit to
# (13,7) and full second visit to (18,1) can't be mistaken for or
# disrupted by a PacMan/Orion collision. This demonstrates both spec
# requirements: "even though the gold pieces are eaten by PacMan, Orion
# still will visit those locations" and "when all gold pieces have been
# visited, Orion will revisit the golds based on the same sequence".

# Troll.0.move/Wizard.0.move (below) hold every OTHER monster still
# (all "S") for 150 ticks - Orion is the only monster actually moving
# during that window, so there's no collision risk to guard against,
# and it's free to run its own real walkApproach() logic (including the
# random fallback, if it needs it) for as long as it takes to complete
# a full patrol lap through all 3 gold pieces. 150 ticks is a deliberately
# generous ~4x margin over the ~35-tick lap time observed under typical
# conditions
#
# PacManTest.test2Feature1NewMonsterTypes deliberately doesn't pin
# exact tick numbers - it checks that each gold location appears in the
# log, and that the 1st gold piece appears a 2nd time (the revisit after
# a full patrol lap), without depending on which tick any of that
# happens on.
#
# Wizard.location=1,6 + Wizard.0.move's first 2 tokens (R,M) directly and deterministically prove the Wizard's
# wall-phasing ability (spec Feature 1b: "able to move through the
# wall") - facing it at a known wall and telling it to move forward,

# (1,6) sits directly
# west of a confirmed wall cell at (2,6) in the default maze,
# Wizard spawns facing North; "R" turns it to face East (2,6 is
# directly east of 1,6), then "M" attempts the move:

# After that 2-tick demo, the rest of the script (148 more "S") holds the
# Wizard still through tick 150 - the same reason Troll is held still
# (see above): while Orion's patrol is still in progress.
# Troll stays parked for the rest of the run (all "S") -
# it has no further role in this test. Wizard, though, resumes movement
# at tick 151: 6 more scripted tokens (R,M,L,M,M,M,M) walk it via BFS
# from its resting cell (3,6, the cell just beyond the wall it phased
# through at tick 2) down and east to (7,7) - PacMan's own resting cell
# (see PacMan.move below) - landing exactly on it at tick 156 (confirmed
# via repeated real runs - Wizard's own script consumption is unaffected
# by Orion's randomness, so this tick never varies even though Orion's
# path does) and ending the game as "GAME OVER".

