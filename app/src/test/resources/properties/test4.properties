# test4: Feature 3 (configurable map), isolated from Feature 1 (new
# monster types) and Feature 2 (item effects) - no gold/ice pickups are
# placed, so any fury/freeze-shaped log lines would only appear if
# Feature 2 wiring leaked in by mistake.
#
# PacMan.move is a fully scripted path.
# Sweeps across the top row, down the right corridor, then back along
# the bottom row of the custom maze, then holds position (S) at (1,7)
# from tick 22 on.
feature1.active=false
feature2.active=false
feature3.active=true

# A custom 10x10 maze (spec minimum size), distinct from the hardcoded
# default and from test5.properties's 14x10 layout. PacMan's and every
# monster's start location are embedded directly in the layout itself
# (per spec: "the initial location of PacMan/monsters is defined within
# the map file"), not as separate properties. 3 "T" markers (row-major
# scan order: (7,7) -> Troll-0, (1,8) -> Troll-1, (8,8) -> Troll-2),
# up from the original single Troll, so MonsterCreator's Feature-3
# marker path is exercised for multiple instances of the same type, not
# just one. Character legend:
#   x = wall (impassable)
#   . = pill (walkable, awards a pill on pickup)
#   (space) = empty walkable cell, no pill
#   P = PacMan start location
#   T = Troll start location
Map.layout=xxxxxxxxxx;\
xP.......x;\
x.xxxxxx.x;\
x......x.x;\
x.x.xx.x.x;\
x......x.x;\
x.xxxxxx.x;\
x......T.x;\
xTxxxxxxTx;\
xxxxxxxxxx

# This maze's only walkable topology outside the interior pockets
# (rows 3-5, cols 3-6 - fully enclosed islands, unreachable from
# anywhere else, same as they always were) is a single rectangular
# ring: row 1, column 8 (rows 1-7), row 7, and column 1 (rows 1-7) -
# plus two 1-cell dead-end pockets hanging off row 7's ends, (1,8) and
# (8,8), where Troll-1/Troll-2 now start. PacMan's own scripted route
# sweeps almost that entire ring once (row 1 east, column 8 south, row
# 7 west) before parking permanently at (1,7) from tick 22 on - which
# means every ring cell PacMan ever occupies is only "hot" for the one
# tick it's actually there, not forever, so a monster can safely be on
# the very same cell at any other tick.
#

Troll.0.move=L,M,M,M,M,M,M,R,M,M,M,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,R,R,M,M,M
Troll.1.move=S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,M
Troll.2.move=S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,M,L,M,M,M,M,M,M,M
Simulation.period=100
#Auto Test Configurations
PacMan.isAuto=true
PacMan.move=M,M,M,M,M,M,M,R,M,M,M,M,M,M,R,M,M,M,M,M,M,M,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S,S
