# test3: Feature 2 (item effects: fury/freeze), isolated from Feature 1
# and Feature 3 - only Troll is present, and the default hardcoded maze
# is used. The default maze's column-4 items (PacMan's start column)
# include one gold (row 7, triggers fury) and one ice cube (row 5,
# triggers freeze).
#
# PacMan.move is a fully scripted path for its entire
# route, so PacMan's own movement is 100% determined by this file, not
# the built-in autopilot - and never needs it either: this maze's 7
# pickup items (5 pills + the 2 golds specified below - all in column
# 4, plus an ice cube also in column 4) are ALL on this scripted route,
# so the run always ends in a real "YOU WIN" once the last one is
# eaten.

# PacMan starts at (16,7), reaches the gold (4,7) at tick 14 (fury
# triggers), then detours south to the (4,8)/(4,9) pills (ticks
# 16/17) and back before heading north via the column-3 detour to the
# ice (4,5) at tick 28 (freeze triggers). PacMan then eats the 2nd gold (5,5) at tick 29 - the very
# first tick of the freeze window - before finishing the remaining
# pills at (4,3)/(4,2)/(4,1), ending at tick 39 with all 7 items (5
# pills + 2 golds; ice doesn't count) collected, for a guaranteed "YOU
# WIN".
#
# Troll.0.move scripts Troll's movement directly. A scripted move is still consumed
# every tick even while furious or frozen - the script's "clock"
# doesn't pause for an effect - but what happens with it differs:
# during freeze the instruction is burned, not applied (the monster
# always stays put, same as an un-scripted monster's own
# onFrozenTick()); during fury it's genuinely applied, with "M" moving
# 2 cells if possible (matching the fury movement rule) instead of 1,
# in whatever direction the monster is currently facing.
#
# Troll.location=14,3. Troll spawns facing NORTH; a single
# "L" (tick 1) turns it to face WEST, then it holds (13 "S"s, ticks
# 2-14) until fury triggers. The 5-tick fury window (ticks 15-19) is
# then 5 clean, unblocked 2-cell jumps in a row (14,3 -> 12,3 -> 10,3
# -> 8,3 -> 6,3 -> 4,3) - open road the whole way, so both the 1st AND
# 2nd jumps (the specific ask) are unambiguously clean, not just the
# 1st.
#
# Once fury ends (tick 19), Troll doesn't just sit still until freeze -
# "R,R" (ticks 20-21) turns it around to face EAST, then 6 more "M"s
# (ticks 22-27) walk it back east along the same open row-3 corridor
# to (10,3): real, visible scripted movement during the Normal-state
# gap described above, not silence. It then holds ("S", tick 28
# onward) through the ice pickup/freeze trigger (tick 28), the 3-tick
# frozen window (ticks 29-31, fully silent - freeze burns the
# scripted instruction regardless of content), and the rest of the
# run: (10,3) is on row 3.
#
# A 2nd gold piece (5,5), one cell east of the ice. PacMan eats it at
# tick 29, the very first tick of the 3-tick freeze window (freeze
# triggers tick 28) - spec 3d.3: eating gold while frozen must not
# make Troll furious. The [Effect] Fury line still logs (it just
# records that PacMan interacted with gold).

